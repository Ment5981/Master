services:
  master:
    build:
      context: ../..
    image: ${MASTER_IMAGE:-master-self-hosted:local}
    container_name: master-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MASTER_SELF_HOSTED: "1"
      MASTER_SQLITE_PATH: /data/master.sqlite
      PORT: "3000"
    volumes:
      - master-data:/data
    expose:
      - "3000"
    networks:
      master_shared:
        aliases:
          - master-app
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  master-data:
    name: master-data

networks:
  master_shared:
    external: true
