name: Master self-hosted image

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "db/**"
      - "public/**"
      - "worker/**"
      - "build/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "next.config.ts"
      - ".github/workflows/self-hosted-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ment5981/master-self-hosted:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
